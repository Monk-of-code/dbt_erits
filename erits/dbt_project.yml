name: dbt_erits
version: "1.0"
profile: erits

model-paths: ["models"]
analysis-paths: ["analysis"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_modules"]

models:
  dbt_erits:
    staging:
      +schema: "Silver"
      +materialized: incremental
      +unique_key: uuid
      +on_schema_change: sync_all_columns
      
      preparation:
        +materialized: incremental
        +unique_key: uuid
        
      gen_uuid_and_linking:
        +materialized: incremental
        +unique_key: uuid
        
      aggregate_count:
        +materialized: incremental
        +unique_key: uuid
        
      interest:
        +materialized: incremental
        +unique_key: uuid
        
    marts:
      +schema: "gold"
      +materialized: incremental
      +unique_key: uuid  
    
